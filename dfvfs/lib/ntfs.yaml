# dtFabric format specification.
---
name: ntfs
type: format
description: New Technologies File System (NTFS) format
urls: ["https://github.com/libyal/libfsntfs/blob/main/documentation/New%20Technologies%20File%20System%20(NTFS).asciidoc"]
---
name: uint8
type: integer
attributes:
  format: unsigned
  size: 1
  units: bytes
---
name: uint32
type: integer
attributes:
  format: unsigned
  size: 4
  units: bytes
---
name: uint64
type: integer
attributes:
  format: unsigned
  size: 8
  units: bytes
---
name: wchar16
type: character
attributes:
  size: 2
  units: bytes
---
name: ntfs_file_name
type: structure
description: NTFS $FILE_NAME attribute data
attributes:
  byte_order: little-endian
members:
- name: parent_file_reference
  data_type: uint64
- name: creation_time
  data_type: uint64
- name: modification_time
  data_type: uint64
- name: entry_modification_time
  data_type: uint64
- name: access_time
  data_type: uint64
- name: allocated_data_size
  data_type: uint64
- name: data_size
  data_type: uint64
- name: file_attribute_flags
  data_type: uint32
- name: extended_data
  data_type: uint32
- name: name_size
  data_type: uint8
- name: name_space
  data_type: uint8
- name: name
  type: string
  encoding: utf-16-le
  element_data_type: wchar16
  number_of_elements: ntfs_file_name.name_size
---
name: ntfs_standard_information_v1
type: structure
description: NTFS $STANDARD_INFORMATION attribute data version 1
attributes:
  byte_order: little-endian
members:
- name: creation_time
  data_type: uint64
- name: modification_time
  data_type: uint64
- name: entry_modification_time
  data_type: uint64
- name: access_time
  data_type: uint64
- name: file_attribute_flags
  data_type: uint32
- name: maximum_number_of_versions
  data_type: uint32
- name: version_number
  data_type: uint32
- name: class_identifier
  data_type: uint32
---
name: ntfs_standard_information_v3
type: structure
description: NTFS $STANDARD_INFORMATION attribute data version 3
attributes:
  byte_order: little-endian
members:
- name: creation_time
  data_type: uint64
- name: modification_time
  data_type: uint64
- name: entry_modification_time
  data_type: uint64
- name: access_time
  data_type: uint64
- name: file_attribute_flags
  data_type: uint32
- name: maximum_number_of_versions
  data_type: uint32
- name: version_number
  data_type: uint32
- name: class_identifier
  data_type: uint32
- name: owner_identifier
  data_type: uint32
- name: security_descriptor_identifier
  data_type: uint32
- name: quota_charged
  data_type: uint64
- name: update_sequence_number
  data_type: uint64
